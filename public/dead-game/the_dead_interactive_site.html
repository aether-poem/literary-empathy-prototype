<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Dead · Interactive</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f1eee4;
      --muted: #b8b1a2;
      --faint: #817a6d;
      --paper: rgba(26, 25, 22, 0.74);
      --paper-solid: #1b1a17;
      --line: rgba(241, 238, 228, 0.16);
      --accent: #d7c08f;
      --blue: #9db1bd;
      --red: #b27668;
      --bg: #11120f;
      --bg2: #20211d;
      --shadow: rgba(0, 0, 0, 0.48);
      --serif: Georgia, "Times New Roman", "Songti SC", serif;
      --sans: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--serif);
    }

    body {
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(157, 177, 189, 0.16), transparent 27rem),
        radial-gradient(circle at 78% 12%, rgba(215, 192, 143, 0.10), transparent 24rem),
        linear-gradient(145deg, #0c0d0c, var(--bg) 42%, var(--bg2));
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at 52% 42%, black, transparent 78%);
    }

    body::after {
      background:
        linear-gradient(to bottom, rgba(0,0,0,.52), transparent 24%, transparent 68%, rgba(0,0,0,.62)),
        radial-gradient(circle at center, transparent 34%, rgba(0,0,0,.48));
    }

    .snow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.7;
    }

    .flake {
      position: absolute;
      top: -12px;
      width: var(--s);
      height: var(--s);
      border-radius: 50%;
      background: rgba(241, 238, 228, var(--o));
      filter: blur(var(--b));
      animation: fall var(--d) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes fall {
      from { transform: translate3d(var(--x), -4vh, 0); }
      to { transform: translate3d(calc(var(--x) + var(--drift)), 106vh, 0); }
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
    }

    aside {
      min-height: 100vh;
      padding: clamp(22px, 4vw, 48px);
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10,10,9,.72), rgba(10,10,9,.26));
      backdrop-filter: blur(14px);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 64px);
    }

    .kicker {
      font-family: var(--sans);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      font-size: 12px;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(46px, 7vw, 92px);
      line-height: .9;
      font-weight: 400;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      max-width: 26rem;
      font-size: 16px;
    }

    .meter-block {
      margin-top: 38px;
      display: grid;
      gap: 12px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .meter {
      height: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 38%;
      background: linear-gradient(90deg, var(--blue), var(--accent));
      transition: width 500ms ease;
    }

    .ledger {
      margin-top: 36px;
      display: grid;
      gap: 10px;
      color: var(--faint);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
    }

    .ledger strong {
      color: var(--muted);
      font-weight: 500;
    }

    .reader {
      width: min(820px, 100%);
      min-height: min(720px, calc(100vh - 96px));
      display: grid;
      align-content: center;
      gap: 22px;
      padding: clamp(28px, 6vw, 72px);
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 26px 80px var(--shadow);
      backdrop-filter: blur(18px);
      position: relative;
    }

    .reader::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(215, 192, 143, .13);
      pointer-events: none;
    }

    .chapter {
      font-family: var(--sans);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .12em;
      font-size: 12px;
    }

    .scene {
      display: grid;
      gap: 6px;
      margin-bottom: 6px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.5;
    }

    .scene b {
      color: var(--ink);
      font-weight: 500;
      letter-spacing: .02em;
    }

    h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.05;
      font-weight: 400;
    }

    .text {
      display: grid;
      gap: 14px;
      color: var(--ink);
      font-size: clamp(18px, 2.1vw, 22px);
      line-height: 1.7;
      max-width: 66ch;
    }

    .segment {
      margin: 0;
      animation: rise 420ms ease both;
    }

    .speaker {
      color: var(--accent);
      font-variant: small-caps;
      margin-right: .45rem;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.045);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.3;
      text-align: left;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease, border-color 180ms ease;
      border-radius: 0;
    }

    button:hover {
      background: rgba(215, 192, 143, .11);
      border-color: rgba(215, 192, 143, .44);
      transform: translateX(4px);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .small-btn {
      font-size: 12px;
      padding: 10px 12px;
      color: var(--muted);
    }

    .ending {
      border-left: 2px solid var(--accent);
      padding-left: 18px;
    }

    .ending-type {
      color: var(--accent);
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: .12em;
    }

    .closing {
      color: var(--accent);
      font-style: italic;
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--paper-solid);
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--sans);
      padding: 10px 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, bottom 220ms ease;
      z-index: 5;
      max-width: min(92vw, 520px);
    }

    .toast.show {
      opacity: 1;
      bottom: 34px;
    }

    @media (max-width: 840px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 24px;
      }

      h1 {
        font-size: 46px;
      }

      .meter-block, .ledger {
        margin-top: 20px;
      }

      main {
        padding: 16px;
      }

      .reader {
        min-height: auto;
        padding: 28px 22px;
      }

      .reader::before {
        inset: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="snow" id="snow"></div>
  <div class="shell">
    <aside>
      <div class="kicker">Interactive adaptation</div>
      <h1>The Dead</h1>
      <p class="subtitle">A playable literary version of Joyce's winter gathering, built around attention, wounded dignity, and the snow that reaches everyone.</p>
      <div class="meter-block">
        <div class="meta-row"><span id="varName">Snowfall</span><span id="varValue">38</span></div>
        <div class="meter"><span id="varFill"></span></div>
        <div class="meta-row"><span>Progress</span><span id="progressValue">0%</span></div>
        <div class="meter"><span id="progressFill"></span></div>
      </div>
      <div class="ledger">
        <div><strong>Scene</strong> <span id="ledgerScene">Loading</span></div>
        <div><strong>Flags</strong> <span id="ledgerFlags">none</span></div>
        <div><strong>Endings found</strong> <span id="ledgerEndings">0</span></div>
      </div>
      <div class="actions">
        <button class="small-btn" id="restartBtn">Restart</button>
        <button class="small-btn" id="backBtn">Back</button>
        <button class="small-btn" id="saveBtn">Save</button>
        <button class="small-btn" id="loadBtn">Load</button>
      </div>
    </aside>
    <main>
      <article class="reader" id="reader">
        <div class="chapter">Loading</div>
        <h2>The Dead</h2>
        <div class="text"><p class="segment">Loading story JSON...</p></div>
      </article>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const state = {
      story: null,
      nodeId: "",
      val: 0,
      vars: {},
      flags: new Set(),
      achievements: new Set(JSON.parse(localStorage.getItem("dead_achievements") || "[]")),
      endings: new Set(JSON.parse(localStorage.getItem("dead_endings") || "[]")),
      history: []
    };

    const el = {
      snow: document.getElementById("snow"),
      reader: document.getElementById("reader"),
      varName: document.getElementById("varName"),
      varValue: document.getElementById("varValue"),
      varFill: document.getElementById("varFill"),
      progressValue: document.getElementById("progressValue"),
      progressFill: document.getElementById("progressFill"),
      ledgerScene: document.getElementById("ledgerScene"),
      ledgerFlags: document.getElementById("ledgerFlags"),
      ledgerEndings: document.getElementById("ledgerEndings"),
      restartBtn: document.getElementById("restartBtn"),
      backBtn: document.getElementById("backBtn"),
      saveBtn: document.getElementById("saveBtn"),
      loadBtn: document.getElementById("loadBtn"),
      toast: document.getElementById("toast")
    };

    function makeSnow() {
      const count = window.matchMedia("(max-width: 840px)").matches ? 46 : 86;
      el.snow.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const f = document.createElement("i");
        f.className = "flake";
        f.style.setProperty("--x", `${Math.random() * 100}vw`);
        f.style.setProperty("--drift", `${(Math.random() * 24 - 12).toFixed(1)}vw`);
        f.style.setProperty("--s", `${(Math.random() * 3.2 + 1).toFixed(1)}px`);
        f.style.setProperty("--o", `${(Math.random() * .58 + .22).toFixed(2)}`);
        f.style.setProperty("--b", `${(Math.random() * 1.8).toFixed(1)}px`);
        f.style.setProperty("--d", `${(Math.random() * 16 + 12).toFixed(1)}s`);
        f.style.setProperty("--delay", `${(-Math.random() * 22).toFixed(1)}s`);
        el.snow.appendChild(f);
      }
    }

    async function init() {
      makeSnow();
      try {
        const response = await fetch("the_dead_game.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.story = await response.json();
        start();
      } catch (error) {
        el.reader.innerHTML = `<div class="chapter">Load error</div><h2>Could not load JSON</h2><div class="text"><p class="segment">Run this folder through a local server, then open this page again.</p><p class="segment">${escapeHtml(error.message)}</p></div>`;
      }
    }

    function start() {
      state.nodeId = state.story.startNodeId;
      state.val = clamp(state.story.meta.initialVariable ?? 0);
      state.vars = JSON.parse(JSON.stringify(state.story.variables || {}));
      state.flags = new Set();
      state.history = [];
      render();
    }

    function render() {
      const node = state.story.nodes[state.nodeId];
      if (!node) return showToast(`Missing node: ${state.nodeId}`);

      if (node.routes) {
        const route = node.routes.find(r => testCondition(r.condition));
        if (route) {
          state.nodeId = route.next;
          render();
          return;
        }
      }

      updateHud(node);

      if (node.isEnding) {
        state.endings.add(state.nodeId);
        if (node.achievement) state.achievements.add(node.achievement);
        persistRecords();
        el.reader.innerHTML = `
          <div class="ending">
            <div class="ending-type">${escapeHtml(node.type || "ENDING")}</div>
            <h2>${escapeHtml(node.title)}</h2>
            <div class="text">
              <p class="segment">${escapeHtml(node.description || "")}</p>
              <p class="segment closing">${escapeHtml(node.closing || "")}</p>
            </div>
            <div class="choices">
              <button onclick="start()">Begin again</button>
            </div>
          </div>
        `;
        return;
      }

      if (node.next && !node.choices) {
        el.reader.innerHTML = makeNodeHtml(node, `<button onclick="goNext('${node.next}')">Continue</button>`);
        return;
      }

      const choices = (node.choices || []).filter(c => testCondition(c.condition));
      el.reader.innerHTML = makeNodeHtml(node, choices.map((choice, i) => `<button onclick="choose(${i})">${escapeHtml(choice.text)}</button>`).join(""));
      state.visibleChoices = choices;
    }

    function makeNodeHtml(node, choiceHtml) {
      const scene = normalizeScene(node.scene);
      const chapter = node.chapterTitle || "";
      const segments = (node.segments || []).map((seg, idx) => {
        const speaker = seg.speaker ? `<span class="speaker">${escapeHtml(seg.speaker)}</span>` : "";
        return `<p class="segment" style="animation-delay:${idx * 48}ms">${speaker}${escapeHtml(seg.text || "")}</p>`;
      }).join("");
      return `
        <div class="chapter">${escapeHtml(chapter || state.story.meta.title || "")}</div>
        <h2>${escapeHtml(node.title || scene.name || "")}</h2>
        <div class="scene"><b>${escapeHtml(scene.name || "")}</b><span>${escapeHtml(scene.description || "")}</span></div>
        <div class="text">${segments}</div>
        <div class="choices">${choiceHtml || ""}</div>
      `;
    }

    function choose(index) {
      const choice = state.visibleChoices[index];
      if (!choice) return;
      state.history.push(snapshot());
      applyChanges(choice.changes || {});
      if (choice.effect || choice.effects) flashEffect(choice.effect || choice.effects);
      state.nodeId = choice.next;
      render();
    }

    function goNext(next) {
      state.history.push(snapshot());
      state.nodeId = next;
      render();
    }

    function applyChanges(changes) {
      if (typeof changes.val === "number") state.val = clamp(state.val + changes.val);
      if (typeof changes.valSet === "number") state.val = clamp(changes.valSet);
      if (changes.set) Object.assign(state.vars, changes.set);
      if (changes.addFlag) addFlag(changes.addFlag, changes.important);
      if (Array.isArray(changes.addFlags)) changes.addFlags.forEach(f => addFlag(f, changes.important));
      if (changes.importantFlag) addFlag(changes.importantFlag, true);
      if (Array.isArray(changes.importantFlags)) changes.importantFlags.forEach(f => addFlag(f, true));
      if (changes.removeFlag) state.flags.delete(changes.removeFlag);
      if (changes.unlockAchievement) unlock(changes.unlockAchievement);
      if (Array.isArray(changes.unlockAchievements)) changes.unlockAchievements.forEach(unlock);
    }

    function addFlag(flag, important = false) {
      const record = typeof flag === "string" ? { id: flag, label: flag } : { id: flag.flag || flag.id, label: flag.label || flag.flag || flag.id };
      if (!record.id) return;
      const fresh = !state.flags.has(record.id);
      state.flags.add(record.id);
      if (important && fresh) showToast(`Important decision recorded: ${record.label}`);
    }

    function unlock(id) {
      if (!id || state.achievements.has(id)) return;
      state.achievements.add(id);
      const ach = state.story.achievements?.[id];
      showToast(ach ? `Achievement: ${ach.title}` : `Achievement: ${id}`);
      persistRecords();
    }

    function testCondition(condition) {
      if (!condition || condition === "default") return true;
      if (typeof condition === "string") return testStringCondition(condition);
      if (condition.all) return condition.all.every(testCondition);
      if (condition.any) return condition.any.some(testCondition);
      if (condition.not) return !testCondition(condition.not);
      if (condition.flag) return state.flags.has(condition.flag);
      if (condition.var) return compare(getVar(condition.var), condition.op, condition.value);
      return true;
    }

    function testStringCondition(condition) {
      const text = condition.trim();
      if (text.startsWith("hasFlag")) return state.flags.has(text.match(/'([^']+)'/)?.[1]);
      if (text.startsWith("!hasFlag")) return !state.flags.has(text.match(/'([^']+)'/)?.[1]);
      const match = text.match(/^([a-zA-Z_][\w]*)\s*(>=|<=|==|!=|>|<)\s*'?([^']+)'?$/);
      if (!match) return true;
      const [, key, op, raw] = match;
      const left = key === "val" ? state.val : getVar(key);
      const right = isNaN(Number(raw)) ? raw : Number(raw);
      return compare(left, op, right);
    }

    function compare(left, op, right) {
      if (op === ">=") return left >= right;
      if (op === "<=") return left <= right;
      if (op === ">") return left > right;
      if (op === "<") return left < right;
      if (op === "==") return left == right;
      if (op === "!=") return left != right;
      return false;
    }

    function getVar(key) {
      return key === "val" ? state.val : state.vars[key];
    }

    function updateHud(node) {
      const meta = state.story.meta;
      const scene = normalizeScene(node.scene);
      el.varName.textContent = meta.variableName || "State";
      el.varValue.textContent = Math.round(state.val);
      el.varFill.style.width = `${clamp(state.val)}%`;
      const progress = clamp(node.progress || 0);
      el.progressValue.textContent = `${Math.round(progress)}%`;
      el.progressFill.style.width = `${progress}%`;
      el.ledgerScene.textContent = scene.name || "Unknown";
      el.ledgerFlags.textContent = state.flags.size ? [...state.flags].slice(-4).join(", ") : "none";
      el.ledgerEndings.textContent = state.endings.size;
    }

    function normalizeScene(scene) {
      if (!scene) return {};
      if (typeof scene === "string") return { name: scene };
      return scene;
    }

    function snapshot() {
      return {
        nodeId: state.nodeId,
        val: state.val,
        vars: JSON.parse(JSON.stringify(state.vars)),
        flags: [...state.flags]
      };
    }

    function restore(snap) {
      if (!snap) return;
      state.nodeId = snap.nodeId;
      state.val = snap.val;
      state.vars = snap.vars;
      state.flags = new Set(snap.flags);
      render();
    }

    function saveGame() {
      localStorage.setItem("dead_save", JSON.stringify(snapshot()));
      showToast("Saved.");
    }

    function loadGame() {
      const snap = JSON.parse(localStorage.getItem("dead_save") || "null");
      if (!snap) return showToast("No save found.");
      restore(snap);
      showToast("Loaded.");
    }

    function persistRecords() {
      localStorage.setItem("dead_achievements", JSON.stringify([...state.achievements]));
      localStorage.setItem("dead_endings", JSON.stringify([...state.endings]));
    }

    function flashEffect(effect) {
      const effects = Array.isArray(effect) ? effect : [effect];
      if (effects.includes("blackout")) document.body.animate([{ opacity: 1 }, { opacity: .12 }, { opacity: 1 }], { duration: 620 });
      if (effects.includes("cold")) document.body.animate([{ filter: "saturate(1)" }, { filter: "saturate(.55) brightness(1.12)" }, { filter: "saturate(1)" }], { duration: 760 });
      if (effects.includes("silence")) el.reader.animate([{ transform: "scale(1)" }, { transform: "scale(.992)" }, { transform: "scale(1)" }], { duration: 620 });
    }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove("show"), 2200);
    }

    function clamp(value) {
      return Math.max(0, Math.min(100, Number(value) || 0));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
    }

    el.restartBtn.addEventListener("click", start);
    el.backBtn.addEventListener("click", () => restore(state.history.pop()));
    el.saveBtn.addEventListener("click", saveGame);
    el.loadBtn.addEventListener("click", loadGame);
    window.addEventListener("resize", makeSnow);
    init();
  </script>
</body>
</html>
